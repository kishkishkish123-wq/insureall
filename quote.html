<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Get a Quote — InsureAll</title>
<meta name="description" content="Get a free life insurance quote. No obligation, response within 1 business day."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Insure<span>All</span></a>
    <a href="index.html" class="btn-outline">Back to Home</a>
  </div>
</nav>

<section class="section" style="padding-top:56px">
  <div class="container">
    <div class="section-header">
      <span class="eyebrow">Get a Quote</span>
      <h2>Tell us a bit about yourself.</h2>
      <p>A dedicated advisor will follow up with your quote within 1 business day.</p>
    </div>

    <div class="quote-wrap">
      <div class="form-card">
        <form id="quoteForm">
          <div class="form-row">
            <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" placeholder="Jordan" required/>
            </div>
            <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" placeholder="Rivera" required/>
            </div>
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="jordan@email.com" required/>
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required/>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" placeholder="35" min="18" max="80" required/>
            </div>
            <div class="field">
              <label for="coverage">Coverage Amount</label>
              <select id="coverage" name="coverage" required>
                <option value="">Select&hellip;</option>
                <option value="250000">$250,000</option>
                <option value="500000" selected>$500,000</option>
                <option value="750000">$750,000</option>
                <option value="1000000">$1,000,000</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="term">Term Length</label>
            <select id="term" name="term" required>
              <option value="10">10 years</option>
              <option value="20" selected>20 years</option>
              <option value="30">30 years</option>
            </select>
          </div>
          <button type="submit" class="btn-primary form-submit" style="width:100%;padding:15px;text-align:center;justify-content:center;margin-top:8px">Request My Free Quote</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <p>&copy; 2026 InsureAll. Life insurance made simple.</p>
  </div>
</footer>

<script>
document.getElementById('quoteForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = this.querySelector('.form-submit');
  btn.textContent = 'Request Received ✓';
  btn.style.background = 'var(--emerald)';
  setTimeout(() => { btn.textContent = "We'll be in touch within 1 business day"; }, 1800);
});
</script>
</body>
</html>
